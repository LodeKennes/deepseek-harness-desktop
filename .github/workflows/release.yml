# Every push to master becomes one numbered desktop release after the complete
# six-platform build and smoke-test matrix succeeds.
name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

# Build numbers are derived from tags, so master releases must run serially.
concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  version:
    name: select release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      build_number: ${{ steps.release.outputs.build_number }}
      existing: ${{ steps.release.outputs.existing }}
      harness_sha: ${{ steps.release.outputs.harness_sha }}
      harness_version: ${{ steps.release.outputs.harness_version }}
      cliproxyapi_version: ${{ steps.release.outputs.cliproxyapi_version }}
    steps:
      - name: Checkout complete tag history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate per-version build number
        id: release
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "error: releases are only allowed from master" >&2
            exit 1
          fi

          base_version=$(jq -r .desktop.version versions.json)
          package_version=$(jq -r .version package.json)
          harness_sha=$(jq -r .harness.sha versions.json)
          harness_version=$(jq -r .harness.version versions.json)
          cliproxyapi_version=$(jq -r .runtimes.cliProxyApi versions.json)

          if [ "$base_version" != "$package_version" ]; then
            echo "error: versions.json desktop.version ($base_version) does not match package.json ($package_version)" >&2
            exit 1
          fi
          if [ -z "$harness_sha" ] || [ "$harness_sha" = "null" ]; then
            echo "error: harness.sha missing from versions.json" >&2
            exit 1
          fi

          ./scripts/next-release-version.sh "$base_version" "$GITHUB_SHA" > release-version.env
          cat release-version.env
          cat release-version.env >> "$GITHUB_OUTPUT"
          {
            echo "harness_sha=$harness_sha"
            echo "harness_version=$harness_version"
            echo "cliproxyapi_version=$cliproxyapi_version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: rebuild release matrix
    needs: version
    uses: ./.github/workflows/build-desktop.yml
    with:
      release_version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read
      actions: write

  release:
    name: publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download rebuilt artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-assets
          find . -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          TARGET_SHA: ${{ github.sha }}
          HARNESS_SHA: ${{ needs.version.outputs.harness_sha }}
          HARNESS_VERSION: ${{ needs.version.outputs.harness_version }}
          CLIPROXYAPI_VERSION: ${{ needs.version.outputs.cliproxyapi_version }}
        run: |
          set -euo pipefail

          mapfile -d '' -t files < <(find release-assets -type f -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "error: no rebuilt artifacts downloaded from this run" >&2
            exit 1
          fi
          printf 'attaching %s\n' "${files[@]}"

          notes=$(cat <<EOF
          Automated master build **${VERSION}** (build ${BUILD_NUMBER}).

          **Unsigned developer-preview build.** Windows SmartScreen and macOS Gatekeeper will warn; Linux packages are accompanied by SHA-256 checksums. There is no auto-update.

          | Component | Version |
          | --- | --- |
          | Desktop | \`${VERSION}\` |
          | Commit | \`${TARGET_SHA}\` |
          | Harness | \`${HARNESS_VERSION}\` |
          | Harness SHA | \`${HARNESS_SHA}\` |
          | CLIProxyAPI | \`${CLIPROXYAPI_VERSION}\` |

          Artifacts were rebuilt and smoke-tested for this commit before the tag and release were created.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; replacing assets for this commit"
            gh release edit "$TAG" \
              --title "DeepSeek Harness ${VERSION}" \
              --latest
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --target "$TARGET_SHA" \
              --title "DeepSeek Harness ${VERSION}" \
              --notes "$notes" \
              --generate-notes \
              --latest
          fi
