name: Build desktop

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DSH_TELEMETRY_DISABLED: "1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  linux-x64:
    name: linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch harness
        run: ./scripts/fetch-harness.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # install + build + manylinux pty.node happen inside stage-runtime.sh
      - name: Stage runtime
        run: ./scripts/stage-runtime.sh

      - name: Install Electron shell
        run: pnpm install --frozen-lockfile

      - name: Sidecar smoke
        run: ./scripts/smoke-sidecar.sh

      - name: Package Linux x64
        run: ./scripts/package.sh

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
        # Do not install libfuse2. AppImage smoke uses --appimage-extract-and-run.

      - name: Packaged smoke
        run: ./scripts/smoke-packaged.sh

      - name: Desktop version
        id: ver
        run: echo "version=$(jq -r .desktop.version versions.json)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-${{ steps.ver.outputs.version }}-linux-x64
          path: |
            dist/installers/DeepSeek-Harness-*-linux-x64.deb
            dist/installers/DeepSeek-Harness-*-linux-x64.AppImage
          if-no-files-found: error
          retention-days: 14

  mac-arm64:
    name: mac-arm64
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch harness
        run: ./scripts/fetch-harness.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # install + build happen inside stage-runtime.sh (no manylinux)
      - name: Stage runtime
        run: ./scripts/stage-runtime.sh

      - name: Install Electron shell
        run: pnpm install --frozen-lockfile

      - name: Sidecar smoke
        run: ./scripts/smoke-sidecar.sh

      - name: Package macOS arm64
        run: ./scripts/package.sh

      - name: Packaged smoke
        run: ./scripts/smoke-packaged.sh

      - name: Desktop version
        id: ver
        run: echo "version=$(jq -r .desktop.version versions.json)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-${{ steps.ver.outputs.version }}-mac-arm64
          path: |
            dist/installers/DeepSeek-Harness-*-mac-arm64.dmg
            dist/installers/DeepSeek-Harness-*-mac-arm64.zip
          if-no-files-found: error
          retention-days: 14
