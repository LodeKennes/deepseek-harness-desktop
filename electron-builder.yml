appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness
asar: true
npmRebuild: false
nodeGypRebuild: false
electronVersion: 37.2.6
# Always pass --publish never from package.sh; no publisher in v1.
publish: null

directories:
  output: dist/installers
  buildResources: resources

# Artifact names match the CI upload contract.
artifactName: DeepSeek-Harness-${version}-${os}-${arch}.${ext}

# Compiled shell only. Default **/* is not merged when a non-ignore
# pattern is present; still deny .cache so a future files tweak cannot
# asar-pack the harness clone.
files:
  - package.json
  - LICENSE
  - out/**/*
  - "!out/**/*.test.js"
  - "!out/**/*.test.js.map"
  - "!**/.cache/**"
  - "!**/.omx/**"

# Staged official Node + @deepseek-ai/dsh tree. Never inside app.asar.
# Name node_modules explicitly: extraResources FileSet omits it by default.
extraResources:
  - from: dist/runtime
    to: harness
    filter:
      - "**/*"
      - "**/node_modules/**"
afterPack: scripts/after-pack.cjs

linux:
  category: Development
  icon: resources/icons
  executableName: deepseek-harness
  # package.sh also passes --config.productName=DeepSeek-Harness so the
  # install prefix is /opt/DeepSeek-Harness (no space; Chromium execvp).
  # Match package.json desktopName / StartupWMClass / binary.
  syncDesktopName: true
  synopsis: DeepSeek Harness desktop
  # Native packages plus a portable AppImage. Host-native x64/arm64 builds.
  # Host-native only: linux-x64 and linux-arm64 are separate artifacts.
  target:
    - target: deb
      arch:
        - x64
        - arm64
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
    - target: pacman
      arch:
        - x64
        - arm64
  desktop:
    entry:
      Name: DeepSeek Harness
      Comment: DeepSeek Harness desktop
      Terminal: "false"
      Type: Application
      Categories: Development;
      StartupWMClass: deepseek-harness

# AppImage cannot ship a working SUID chrome-sandbox helper.
appImage:
  executableArgs:
    - --no-sandbox

# .deb does not pass --no-sandbox; electron-builder installs chrome-sandbox setuid.
deb:
  packageName: deepseek-harness
  priority: optional

rpm:
  packageName: deepseek-harness
  compression: xz

pacman:
  packageName: deepseek-harness
  compression: zstd
  artifactName: DeepSeek-Harness-${version}-${os}-${arch}.pkg.tar.zst
  depends:
    - gtk3
    - libnotify
    - nss
    - libxss
    - libxtst
    - xdg-utils
    - at-spi2-core
    - libsecret

# Separate per-arch artifacts (not lipo/universal). Unsigned v1; CSC is off.
mac:
  category: public.app-category.developer-tools
  icon: resources/icons/512.png
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

# Host-native win-x64 / win-arm64. Unsigned (CSC off in package.sh).
win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

# Assisted installer so the PATH checkbox and directory page exist.
# perMachine: false + selectPerMachineByDefault: false → per-user default.
nsis:
  oneClick: false
  perMachine: false
  selectPerMachineByDefault: false
  allowToChangeInstallationDirectory: true
  include: resources/installer.nsh
